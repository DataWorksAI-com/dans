# DANS + Prompt Firewall — nginx reverse-proxy location blocks
#
# Drop these into the `server { }` block of your site (e.g.
# /etc/nginx/sites-enabled/registry), then:  nginx -t && systemctl reload nginx
#
# Topology (host nginx in front of the Docker-published ports):
#   /dans/            ->  DANS naming server       127.0.0.1:8200
#   /firewall/proxy/  ->  firewall DATA plane       127.0.0.1:8300/proxy/      (request path)
#   /firewall/        ->  firewall ADMIN plane      127.0.0.1:8300/firewall/   (rules / stats / test)
#
# IMPORTANT: the two /firewall locations are intentional. nginx matches the
# LONGEST prefix first, so /firewall/proxy/<label> always hits the data-plane
# location and everything else (/firewall/rules, /firewall/stats,
# /firewall/test) hits the admin location.
#
# Do NOT collapse them into a single `location /firewall/ { proxy_pass ...:8300/; }`.
# That strips the /firewall/ prefix, so the firewall app's admin routes
# (which live under /firewall/*) return 404 while only /proxy survives.

    location /dans/ {
        proxy_pass         http://127.0.0.1:8200/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 30;
        add_header         Access-Control-Allow-Origin * always;
        add_header         Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type, X-API-Key" always;
    }

    location /firewall/proxy/ {
        proxy_pass         http://127.0.0.1:8300/proxy/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60;
        add_header         Access-Control-Allow-Origin * always;
        add_header         Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type, X-API-Key" always;
    }

    location /firewall/ {
        proxy_pass         http://127.0.0.1:8300/firewall/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 60;
        add_header         Access-Control-Allow-Origin * always;
        add_header         Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header         Access-Control-Allow-Headers "Content-Type, X-API-Key" always;
    }
